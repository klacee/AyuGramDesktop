name: build-macos

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system tools
        run: |
          brew update
          brew install cmake ninja python@3.14 ffmpeg dav1d

      # 🔴 关键修正点：正确注入 dav1d（用 dylib，不用 a）
      - name: Inject system dav1d (CRITICAL)
        run: |
          DAV1D_PREFIX="$(brew --prefix dav1d)"
          echo "dav1d prefix = $DAV1D_PREFIX"

          ls "$DAV1D_PREFIX/lib"

          mkdir -p Telegram/ThirdParty/dav1d/build
          cp "$DAV1D_PREFIX/lib/libdav1d.dylib" \
             Telegram/ThirdParty/dav1d/build/

      - name: Prepare Telegram ThirdParty
        run: |
          cd Telegram
          export DAV1D_SKIP_BUILD=1
          python3 build/prepare/prepare.py

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ../Telegram

      - name: Build
        run: |
          cd build
          ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGramDesktop-macOS
          path: build
