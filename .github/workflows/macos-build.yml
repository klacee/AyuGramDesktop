name: Build AyuGram macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja python pkg-config qt ffmpeg

      - name: Cache ThirdParty
        uses: actions/cache@v4
        with:
          path: Telegram/ThirdParty
          key: thirdparty-macos-${{ hashFiles('Telegram/build/prepare/macos.sh') }}

      - name: Prepare ThirdParty
        run: |
          cd Telegram
          bash build/prepare/macos.sh

      - name: Build AyuGram
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES=arm64
          ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: build/*.app
