name: Build AyuGram macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1️⃣ 安装依赖（锁 Qt 6.6）
      - name: Install system dependencies
        run: |
          brew update
          brew uninstall --ignore-dependencies qt || true

          brew install \
            cmake \
            ninja \
            pkg-config \
            python@3.12 \
            qt@6.6 \
            ffmpeg \
            meson \
            nasm \
            yasm \
            dav1d

      # 2️⃣ 明确 Qt 环境
      - name: Setup Qt environment
        run: |
          echo "QT=/opt/homebrew/opt/qt@6.6" >> $GITHUB_ENV
          echo "PATH=/opt/homebrew/opt/qt@6.6/bin:$PATH" >> $GITHUB_ENV

          qmake --version

      # 3️⃣ Telegram 官方配置脚本（就在仓库根目录跑）
      - name: Configure Telegram
        run: |
          python3 Telegram/configure.py

      # 4️⃣ CMake Configure（根目录）
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      # 5️⃣ Build
      - name: Build
        run: |
          cd build
          ninja

      # 6️⃣ 上传产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: build/*.app
