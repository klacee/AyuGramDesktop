

name: Build AyuGram macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            python@3.12 \
            qt \
            meson \
            nasm \
            yasm \
            dav1d \
            ffmpeg

            # ✅ 关键修复点 1：明确告诉 Telegram Qt 在哪
      - name: Setup Qt environment
        run: |
          echo "QT=/opt/homebrew/opt/qt" >> $GITHUB_ENV
          echo "PATH=/opt/homebrew/opt/qt/bin:$PATH" >> $GITHUB_ENV

      - name: Prepare Telegram ThirdParty
        run: |
          cd AyuGramDesktop-dev
          python3 Telegram/build/prepare/prepare.py

      - name: Configure CMake
        run: |
          cd AyuGramDesktop-dev
          mkdir -p build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: |
          cd AyuGramDesktop-dev/build
          ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: AyuGramDesktop-dev/build/*.app

