name: build-macos

on:
  push:
  pull_request:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            python@3.11 \
            qt@6 \
            ada

      - name: Prepare Telegram ThirdParty
        run: |
          cd Telegram/build/prepare
          python3 prepare.py

      - name: Configure build
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_FIND_FRAMEWORK=LAST

      - name: Build AyuGram
        run: |
          cd build
          ninja
