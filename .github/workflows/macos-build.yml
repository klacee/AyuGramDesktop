name: Build AyuGram macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system tools
        run: |
          brew update
          brew install cmake ninja python pkg-config qt ffmpeg dav1d

      - name: Inject prebuilt dav1d (CRITICAL)
        run: |
          mkdir -p Telegram/ThirdParty/dav1d/build
          cp "$(brew --prefix dav1d)/lib/libdav1d.a" \
             Telegram/ThirdParty/dav1d/build/libdav1d.a

      - name: Prepare Telegram ThirdParty
        run: |
          cd Telegram
          export DAV1D_SKIP_BUILD=1
          python3 build/prepare/prepare.py

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: |
          cd build
          ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: build/*.app
