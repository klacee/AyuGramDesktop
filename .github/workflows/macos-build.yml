name: Build AyuGram macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            python \
            pkg-config \
            qt@6 \
            ffmpeg

          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Prepare ThirdParty
        run: |
          cd Telegram
          python3 build/prepare/prepare.py

      - name: Configure build
        run: |
          mkdir build
          cd build
          cmake ../Telegram -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build AyuGram
        run: |
          cd build
          ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: build/*.app
