name: Build AyuGram macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            python@3.11 \
            pkg-config \
            qt \
            ffmpeg

      - name: Prepare Telegram ThirdParty
        run: |
          cd Telegram/build/prepare
          python3 prepare.py

      - name: Configure build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build AyuGram
        run: |
          cd build
          ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: build/*.app
