name: Build AyuGram for macOS (Apple Silicon)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: 检出代码（包含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          repository: klacee/AyuGramDesktop

      - name: 安装系统依赖（适配 macOS，新增 Boost）
        run: |
          brew update
          # 新增 boost 依赖安装
          brew install cmake ninja pkg-config yasm ffmpeg opus qt@6 openssl@3 zlib libpng boost
          brew link --force qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt6):$(brew --prefix openssl@3):$(brew --prefix zlib):$(brew --prefix boost)" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt6)/bin:$PATH" >> $GITHUB_ENV
          echo "LDFLAGS=-L/opt/homebrew/opt/openssl@3/lib -L/opt/homebrew/opt/zlib/lib -L/opt/homebrew/opt/boost/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/openssl@3/include -I/opt/homebrew/opt/zlib/include -I/opt/homebrew/opt/boost/include" >> $GITHUB_ENV

      - name: 源码安装 ada 依赖
        run: |
          git clone https://github.com/ada-url/ada.git /tmp/ada
          cd /tmp/ada
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/homebrew ..
          make -j$(sysctl -n hw.logicalcpu)
          make install
          echo "CMAKE_PREFIX_PATH=/opt/homebrew:$CMAKE_PREFIX_PATH" >> $GITHUB_ENV

      - name: 配置编译参数
        run: |
          mkdir -p build && cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DTD_ENABLE_OPENAL=ON \
            -DTD_ENABLE_OPUS=ON \
            -DTD_USE_PACKAGED=ON \
            -G Ninja \
            ..

      - name: 编译 AyuGram
        run: |
          cd build
          ninja -j$(sysctl -n hw.logicalcpu)

      - name: 打包成 .app 应用
        run: |
          mkdir -p AyuGram.app/Contents/MacOS
          cp build/bin/AyuGram AyuGram.app/Contents/MacOS/
          cat > AyuGram.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>AyuGram</string>
              <key>CFBundleIdentifier</key>
              <string>com.ayugram.desktop</string>
              <key>CFBundleName</key>
              <string>AyuGram</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.social-networking</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macos-AppleSilicon
          path: AyuGram.app

      - name: 上传到 Release（触发 release 事件时）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AyuGram.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
