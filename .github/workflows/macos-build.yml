name: Build AyuGram macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system tools
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            python@3.12 \
            qt \
            ffmpeg \
            meson \
            nasm \
            yasm \
            dav1d

      - name: Setup Qt environment
        run: |
          echo "QT=/opt/homebrew/opt/qt" >> $GITHUB_ENV
          echo "PATH=/opt/homebrew/opt/qt/bin:$PATH" >> $GITHUB_ENV

      # ✅ 正确入口
      - name: Prepare Telegram (configure.py)
        run: |
          python3 Telegram/configure.py

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: |
          cd build
          ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: build/*.app
