name: Build AyuGram macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system tools
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            python@3.12 \
            qt \
            ffmpeg \
             meson \
            nasm \
            yasm \
            dav1d

      # ❗ 关键点：只跑 prepare.py，不注入 ThirdParty
      - name: Prepare Telegram ThirdParty
        run: |
          python3 Telegram/build/prepare/prepare.py

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: |
          cd build
          ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: build/*.app
