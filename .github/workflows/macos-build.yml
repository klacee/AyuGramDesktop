name: Build AyuGram macOS (arm64)

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 🔴 关键修复：强制拉齐所有 submodules（包括嵌套）
      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja python pkg-config qt ffmpeg

      - name: Configure build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES=arm64

      - name: Build AyuGram
        run: |
          cd build
          ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS-arm64
          path: build/*.app
